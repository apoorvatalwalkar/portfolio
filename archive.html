            justify-content: space-evenly;

        </div>

    <body>
        <div >
            <div style="text-align: center; margin-bottom: 40px;">
            </div>

            <div class="button-filter-container archive-buttons">
                <button id="button-all" class="button-box button-select" style="--btn-color: black">
                    All
                </button>
                <button id="button-graphics" class="button-box" style="--btn-color: black">
                    Graphics
                </button>
                <button id="button-animation" class="button-box" style="--btn-color: black">
                    Animation/Modeling
                </button>
                <button id="button-uiux" class="button-box" style="--btn-color: black">
                    Interaction Design
                </button>
                <button id="button-misc" class="button-box" style="--btn-color: black">
                    Miscellaneous
                </button>
            </div>
        </div>

        <div class="archive-content"></div>

        <script>
            const archiveEl = document.querySelector('.archive-content');
            const btnAll = document.getElementById('button-all');
            const btnGraphics = document.getElementById('button-graphics');
            const btnAnimation = document.getElementById('button-animation');
            const btnUIUX = document.getElementById('button-uiux');
            const btnMisc = document.getElementById('button-misc');

            let allWorks = [];
            const knownCategories = ['Graphics', 'Animation', 'Interaction Design'];

            function setActiveButton(activeBtn) {
                [btnAll, btnGraphics, btnAnimation, btnUIUX, btnMisc].forEach(btn => {
                    btn.classList.remove('button-select');
                    btn.classList.add('button-box');
                });

                activeBtn.classList.remove('button-box');
                activeBtn.classList.add('button-select');
            }

            function extractYear(dateString) {
                const match = dateString.match(/\d{4}/);
                return match ? parseInt(match[0]) : 0;
            }

            function groupByYear(works) {
                const grouped = {};
                works.forEach(work => {
                    const year = extractYear(work.date);
                    if (!grouped[year]) {
                        grouped[year] = [];
                    }
                    grouped[year].push(work);
                });
                return grouped;
            }

            function renderArchive(filterCategory = 'all') {
                archiveEl.innerHTML = '';

                let filtered;
                if (filterCategory === 'all') {
                    filtered = allWorks;
                } else if (filterCategory === 'misc') {
                    filtered = allWorks.filter(work => 
                        !knownCategories.includes(work.category) || !work.category
                    );
                } else {
                    filtered = allWorks.filter(work => work.category === filterCategory);
                }

                const groupedWorks = groupByYear(filtered);
                const years = Object.keys(groupedWorks).map(Number).sort((a, b) => b - a); // Latest to oldest

                if (years.length === 0) {
                    archiveEl.innerHTML = '<div style="text-align: center; padding: 40px;"><h4>No works found in this category</h4></div>';
                    return;
                }

                years.forEach(year => {
                    // Add year header
                    const yearHeader = document.createElement('h3');
                    yearHeader.textContent = year;
                    yearHeader.style.cssText = 'margin: 40px 75px 20px 75px; border-bottom: 1px solid black; padding-bottom: 10px; text-align: left; font-size: 24px;';
                    archiveEl.appendChild(yearHeader);

                    const cardsContainer = document.createElement('div');
                    cardsContainer.className = 'archive-grid';

                    // Sort works within the year by date (latest first)
                    const sortedWorks = groupedWorks[year].sort((a, b) => {
                        const dateA = new Date(a.date);
                        const dateB = new Date(b.date);
                        return dateB - dateA;
                    });

                    sortedWorks.forEach(work => {
                        const cardHTML = `
                            <div class="archive-card">
                                <a href="${work.link}" target="${work.target}">
                                    <div class="archive-card-image">
                                        <img src="${work.img}" alt="${work.title}">
                                    </div>
                                    <div class="archive-card-info">
                                        <h4>${work.title}</h4>
                                        <h5>${work.description}</h5>
                                        <h5 style="font-weight: 400">${work.medium} • ${work.date}</h5>
                                    </div>
                                </a>
                            </div>
                        `;
                        cardsContainer.insertAdjacentHTML('beforeend', cardHTML);
                    });

                    archiveEl.appendChild(cardsContainer);
                });
            }

            // Load works data
            fetch('./works.json')
                .then(res => res.json())
                .then(data => {
                    allWorks = data;
                    renderArchive(); 
                })
                .catch(error => {
                    console.error('Error loading works:', error);
                    archiveEl.innerHTML = '<div style="text-align: center; padding: 40px;"><h4>Error loading works. Please try again later.</h4></div>';
                });

            // Button event listeners
            btnAll.addEventListener('click', () => {
                renderArchive('all');
                setActiveButton(btnAll);
            });

            btnGraphics.addEventListener('click', () => {
                renderArchive('Graphics');
                setActiveButton(btnGraphics);
            });

            btnAnimation.addEventListener('click', () => {
                renderArchive('Animation');
                setActiveButton(btnAnimation);
            });

            btnUIUX.addEventListener('click', () => {
                renderArchive('Interaction Design');
                setActiveButton(btnUIUX);
            });

            btnMisc.addEventListener('click', () => {
                renderArchive('misc');
                setActiveButton(btnMisc);
            });
        </script>
    </body>
